<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Expense Tracker</title>
</head>
<body>
  <h1>Expense Tracker</h1>

  <a href="/add">Add Transaction</a>

  <h2>Transactions</h2>

  {% if transactions %}
    <ul>
      {% for t in transactions %}
        <li>${{ t.amount }} — {{ t.category }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No transactions yet.</p>
  {% endif %}
</body>
</html>
