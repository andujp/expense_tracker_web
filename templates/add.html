{% extends "base.html" %}

{% block title %}Add Transaction – Expense Tracker{% endblock %}

{% block content %}
  <h2>Add Transaction</h2>

  <form method="POST" class="form">
    <div class="grid">
      <label>
        Date
        <input type="date" name="date" required value="{{ request.form.get('date', '') }}">
      </label>

      <label>
        Type
        <select name="ttype" required>
          <option value="expense" {% if request.form.get('ttype') == 'expense' %}selected{% endif %}>expense</option>
          <option value="income" {% if request.form.get('ttype') == 'income' %}selected{% endif %}>income</option>
        </select>
      </label>

      <label>
        Amount
        <input type="number" name="amount" step="0.01" min="0" required placeholder="0.00"
               value="{{ request.form.get('amount', '') }}">
      </label>

      <label>
        Category
        <input type="text" name="category" required placeholder="Food, Rent, Gas..."
               value="{{ request.form.get('category', '') }}">
      </label>

      <label>
        Merchant (optional)
        <input type="text" name="merchant" placeholder="Starbucks, Costco..."
               value="{{ request.form.get('merchant', '') }}">
      </label>

      <label>
        Note (optional)
        <input type="text" name="note" placeholder="Any details..."
               value="{{ request.form.get('note', '') }}">
      </label>
    </div>

    <div class="actions">
      <button type="submit">Save</button>
      <a class="btn-secondary" href="{{ url_for('home') }}">Cancel</a>
    </div>
  </form>
{% endblock %}
