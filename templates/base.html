<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Expense Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <header class="header">
    <div class="container header-inner">
      <h1 class="logo">Expense Tracker</h1>

      <nav class="nav">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('add') }}">Add</a>
        <a href="{{ url_for('months') }}">Months</a>
      </nav>
      
      <button
  type="button"
  id="themeToggle"
  class="theme-btn floating-toggle"
>
  🌙
</button>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script>
    const body = document.body;
    const btn = document.getElementById("themeToggle");

    if (!btn) {
      console.log("themeToggle button not found");
    } else {
      const saved = localStorage.getItem("theme");
      if (saved === "dark") body.classList.add("dark");

      const setIcon = () => {
        btn.textContent = body.classList.contains("dark") ? "☀️" : "🌙";
      };
      setIcon();

      btn.addEventListener("click", () => {
        body.classList.toggle("dark");
        localStorage.setItem("theme", body.classList.contains("dark") ? "dark" : "light");
        setIcon();
        console.log("toggled theme, dark =", body.classList.contains("dark"));
      });
    }
  </script>
</body>
</html>
